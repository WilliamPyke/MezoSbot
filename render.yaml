# Render free web service running the bot image (deploy/Dockerfile.bot), deployed on every push to
# TestingRender. Variables are set in the dashboard. A free service sleeps after 15 minutes without
# inbound traffic; deploy/render-keepalive pings /healthz every 10 minutes to keep it awake.
services:
  - type: web
    name: mezosbot
    runtime: docker
    plan: free
    branch: TestingRender
    dockerfilePath: ./deploy/Dockerfile.bot
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
