services:
  - type: web
    name: mezosbot
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DISCORD_GUILD_MEMBERS_INTENT
        value: "false"
      - key: DISCORD_MESSAGE_CONTENT_INTENT
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "31612"
      - key: TOKEN_CONTRACT
        value: "0x7b7C000000000000000000000000000000000000"
      - key: TOKEN_DECIMALS
        value: "18"
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: EXPLORER_URL
        value: "https://explorer.mezo.org"
      - key: PUBLIC_BASE_URL
        value: "https://play.mallard.sh"
      - key: MEZO_DEFAULT_NETWORK
        value: "mainnet"
      - key: MEZO_MAINNET_RPC_URL
        value: "https://rpc-http.mezo.boar.network"
      - key: MEZO_TESTNET_RPC_URL
        value: "https://rpc.test.mezo.org"
      - key: ESCROW_MAINNET_CONTRACT_ADDRESS
        sync: false
      - key: ESCROW_TESTNET_CONTRACT_ADDRESS
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ESCROW_SETTLER_PRIVATE_KEY
        sync: false
      - key: ESCROW_TREASURY_ADDRESS
        sync: false
      - key: ESCROW_PLATFORM_FEE_BPS
        value: "1000"
      - key: WALLETCONNECT_PROJECT_ID
        sync: false
      - key: WEB_SESSION_SECRET
        sync: false
      - key: MIN_WITHDRAWAL_SATS
        value: "50"
      - key: SKIP_WITHDRAWAL_MIN
        value: "false"
      - key: DEPOSIT_ADMIN_ONLY
        value: "false"
      - key: DEPOSIT_POLL_MS
        value: "60000"
      - key: DEPOSIT_ADDRESS_REFRESH_MS
        value: "900000"
      - key: POKEMON_ENABLED
        value: "true"
      - key: POKEMON_TEXT_INPUT_ENABLED
        value: "false"
      - key: GB_CHANNEL_ID
        sync: false
      - key: ROM_PATH
        value: "./pokeyellow.gbc"
      - key: GB_MIN_BID
        value: "0.001"
      - key: GB_ROUND_MS
        value: "400"
      - key: GB_SPEED
        value: "1"
      - key: GB_HOLD_FRAMES
        value: "15"
      - key: STREAM_TARGET_FPS
        value: "60"
      - key: STREAM_MIN_FPS
        value: "60"
      - key: STREAM_MAX_FPS
        value: "60"
      - key: STREAM_AUTO_TUNE
        value: "false"
      - key: STREAM_VIEWER_SCALE
        value: "4"
      - key: STUN_SERVERS
        value: "stun:stun.l.google.com:19302"
