<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mezo Arcade</title>
<style>body{margin:0;background:#10130f;color:#eef5e8;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(42rem,94vw)}#board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;aspect-ratio:1;background:#293126;padding:4px}.cell{background:#182016;border:0}.cell.f{background:#78c850}.cell.m{background:#ffd24c}.pieces{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}button{font:inherit;padding:.7rem 1rem;background:#315c2e;color:white;border:1px solid #6ba864;border-radius:.5rem}button[aria-pressed=true]{outline:3px solid #ffd24c}.hud{display:flex;justify-content:space-between}.error{color:#ff9c9c}</style></head>
<body><main><h1>Mezo Arcade</h1><div class="hud"><span id="status">Loading…</span><b id="score"></b></div><div id="board"></div><div class="pieces" id="pieces"></div><button id="rotate">Rotate</button> <button id="ready">Ready</button> <button id="submit">Submit score</button><p>Choose a piece, then choose its top-left board cell.</p></main>
<script>
const q=new URLSearchParams(location.search),token=q.get('token'),base='?token='+encodeURIComponent(token);let state,selected=0,rotation=0;
async function api(path,method='GET',body){const r=await fetch('/api/v1/arcade/'+path+base,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error?.message||'Request failed');return v.value}
function render(){const s=state.self,m=state.match;document.querySelector('#score').textContent='Score '+s.score+' ×'+s.multiplier;document.querySelector('#status').textContent=m.status==='waiting'?'Waiting for opponent':(m.player_a_ready&&m.player_b_ready)||m.mode==='practice'?'Playing':'Both players must ready';const b=document.querySelector('#board');b.innerHTML='';s.board.forEach((row,y)=>row.forEach((v,x)=>{const c=document.createElement('button');c.className='cell '+(v===1?'f':v===2?'m':'');c.ariaLabel='row '+y+' column '+x;c.onclick=()=>move(y,x);b.append(c)}));const p=document.querySelector('#pieces');p.innerHTML='';s.pieces.forEach((piece,i)=>{const x=document.createElement('button');x.textContent=piece?piece.defId:'Empty';x.disabled=!piece;x.ariaPressed=String(i===selected);x.onclick=()=>{selected=i;render()};p.append(x)})}
async function refresh(){state=await api('state');render()}
async function move(row,col){try{const v=await api('move','POST',{kind:'place',level:state.self.level,pieceIndex:selected,rotation,row,col});state.self=v.self;render()}catch(e){document.querySelector('#status').textContent=e.message}}
document.querySelector('#rotate').onclick=()=>{rotation=(rotation+1)%4;document.querySelector('#rotate').textContent='Rotate '+(rotation*90)+'°'};
document.querySelector('#ready').onclick=()=>api('ready','POST',{}).then(refresh).catch(e=>document.querySelector('#status').textContent=e.message);
document.querySelector('#submit').onclick=()=>api('submit','POST',{}).then(v=>document.querySelector('#status').textContent=v.status==='waiting'?'Submitted; waiting for opponent':'Match '+v.status).catch(e=>document.querySelector('#status').textContent=e.message);
refresh().catch(e=>{document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message});
</script></body></html>
