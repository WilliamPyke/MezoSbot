name: bot-image

# Builds deploy/Dockerfile.bot and pushes it to GHCR for the Compute Engine VM,
# which pulls :testingrender (deploy/gce/setup-vm.sh). The image holds no secrets.
on:
  push:
    branches: [TestingRender]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bot-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.bot
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/williampyke/mezosbot-bot:testingrender
            ghcr.io/williampyke/mezosbot-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
